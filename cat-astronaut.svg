<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="space" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#2b2a6e"/>
      <stop offset="55%" stop-color="#14133b"/>
      <stop offset="100%" stop-color="#07061c"/>
    </radialGradient>
    <radialGradient id="planet1" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffd8a8"/>
      <stop offset="100%" stop-color="#e07b39"/>
    </radialGradient>
    <radialGradient id="planet2" cx="0.3" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#a8e6ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#bfe9ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7fd0ff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#d3dae6"/>
    </linearGradient>
    <radialGradient id="thruster" cx="0.5" cy="1" r="0.7">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="55%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ff5e57" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="70" r="2.4"/><circle cx="140" cy="150" r="1.6"/>
    <circle cx="230" cy="60" r="2"/><circle cx="320" cy="120" r="1.4"/>
    <circle cx="410" cy="55" r="2.6"/><circle cx="500" cy="140" r="1.5"/>
    <circle cx="600" cy="70" r="2.2"/><circle cx="700" cy="160" r="1.7"/>
    <circle cx="750" cy="60" r="2.3"/><circle cx="90" cy="300" r="1.8"/>
    <circle cx="180" cy="430" r="2.1"/><circle cx="70" cy="520" r="1.6"/>
    <circle cx="300" cy="520" r="2.4"/><circle cx="430" cy="470" r="1.5"/>
    <circle cx="620" cy="530" r="2"/><circle cx="720" cy="450" r="1.7"/>
    <circle cx="760" cy="330" r="2.2"/><circle cx="260" cy="250" r="1.3"/>
    <circle cx="540" cy="300" r="1.3"/><circle cx="130" cy="60" r="1.4"/>
    <circle cx="370" cy="200" r="1.2"/><circle cx="660" cy="240" r="1.3"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M480 45 v22 M469 56 h22"/>
    <path d="M170 350 v18 M161 359 h18"/>
    <path d="M690 380 v18 M681 389 h18"/>
  </g>

  <!-- Planets -->
  <circle cx="690" cy="470" r="66" fill="url(#planet2)"/>
  <ellipse cx="690" cy="470" rx="98" ry="22" fill="none" stroke="#ffd166" stroke-width="7" opacity="0.85"/>
  <ellipse cx="690" cy="470" rx="98" ry="22" fill="none" stroke="#ffe9a8" stroke-width="3" opacity="0.6"/>
  <path d="M650 440 a44 44 0 0 0 60 14" fill="none" stroke="#8fd0ff" stroke-width="5" opacity="0.5"/>

  <circle cx="120" cy="180" r="40" fill="url(#planet1)"/>
  <ellipse cx="120" cy="180" rx="60" ry="14" fill="none" stroke="#f4f1de" stroke-width="4" opacity="0.7" transform="rotate(-22 120 180)"/>
  <circle cx="104" cy="168" r="7" fill="#c86a2a" opacity="0.5"/>
  <circle cx="134" cy="192" r="5" fill="#c86a2a" opacity="0.5"/>

  <circle cx="560" cy="120" r="22" fill="#b9b3ff" opacity="0.9"/>
  <circle cx="553" cy="113" r="6" fill="#8f88e6" opacity="0.7"/>

  <!-- Comet -->
  <g opacity="0.9">
    <path d="M300 460 L395 385" stroke="#ffe9a8" stroke-width="6" stroke-linecap="round"/>
    <path d="M310 470 L390 405" stroke="#ffd166" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="398" cy="383" r="8" fill="#fffbe8"/>
  </g>

  <!-- ================= CAT ASTRONAUT ================= -->
  <g transform="rotate(-8 400 300)">
    <!-- Tether -->
    <path d="M300 330 Q200 360 175 450" fill="none" stroke="#9aa4b2" stroke-width="5" stroke-dasharray="10 8"/>
    <circle cx="172" cy="456" r="9" fill="none" stroke="#9aa4b2" stroke-width="5"/>

    <!-- Backpack thruster -->
    <rect x="272" y="268" width="54" height="96" rx="16" fill="#b8c1cf" stroke="#7d8797" stroke-width="4"/>
    <rect x="284" y="284" width="30" height="30" rx="8" fill="#8d99ae"/>
    <path d="M292 366 q-30 40 -8 76 q16 26 34 -4 q14 -24 -2 -60 z" fill="url(#thruster)"/>

    <!-- Arms -->
    <path d="M360 300 Q316 330 306 372" fill="none" stroke="url(#suit)" stroke-width="34" stroke-linecap="round"/>
    <path d="M470 300 Q522 322 546 366" fill="none" stroke="url(#suit)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="304" cy="378" r="20" fill="#f7f9fc" stroke="#c3ccd6" stroke-width="4"/>
    <circle cx="550" cy="372" r="20" fill="#f7f9fc" stroke="#c3ccd6" stroke-width="4"/>

    <!-- Legs -->
    <path d="M372 400 Q364 452 330 490" fill="none" stroke="url(#suit)" stroke-width="38" stroke-linecap="round"/>
    <path d="M438 404 Q460 452 494 482" fill="none" stroke="url(#suit)" stroke-width="38" stroke-linecap="round"/>
    <!-- Boots -->
    <path d="M330 490 q-24 8 -22 24 q26 12 48 -4 q4 -14 -26 -20 z" fill="#e63946" stroke="#a41f2b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M494 482 q26 6 26 24 q-24 14 -48 0 q-6 -14 22 -24 z" fill="#e63946" stroke="#a41f2b" stroke-width="4" stroke-linejoin="round"/>

    <!-- Body suit -->
    <ellipse cx="400" cy="345" rx="84" ry="90" fill="url(#suit)" stroke="#aeb7c4" stroke-width="4"/>
    <path d="M400 258 v174" stroke="#c9d1dc" stroke-width="4"/>
    <circle cx="400" cy="360" r="30" fill="#2b2d42" stroke="#1a1b2e" stroke-width="4"/>
    <text x="400" y="371" font-family="Verdana, sans-serif" font-size="30" fill="#7fe3a1" text-anchor="middle">07</text>
    <rect x="344" y="300" width="34" height="16" rx="6" fill="#e63946"/>
    <rect x="422" y="300" width="34" height="16" rx="6" fill="#2a9df4"/>
    <rect x="356" y="418" width="88" height="14" rx="7" fill="#8d99ae"/>

    <!-- Tail -->
    <path d="M322 404 Q262 434 274 496 Q280 528 316 528" fill="none" stroke="#f2a541" stroke-width="22" stroke-linecap="round"/>
    <path d="M300 470 q14 -6 26 6" fill="none" stroke="#e07b39" stroke-width="8" stroke-linecap="round"/>

    <!-- Helmet -->
    <circle cx="404" cy="216" r="96" fill="url(#visor)" stroke="#dfe6ef" stroke-width="8"/>
    <circle cx="404" cy="216" r="96" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
    <path d="M348 168 a72 72 0 0 1 62 -34" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M336 196 a86 86 0 0 1 30 -50" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- Cat face inside -->
    <ellipse cx="404" cy="226" rx="66" ry="60" fill="#fbbf4d"/>
    <path d="M356 186 L344 140 L390 168 Z" fill="#fbbf4d" stroke="#d98a26" stroke-width="3" stroke-linejoin="round"/>
    <path d="M452 186 L464 140 L418 168 Z" fill="#fbbf4d" stroke="#d98a26" stroke-width="3" stroke-linejoin="round"/>
    <path d="M358 182 L352 156 L376 172 Z" fill="#ffb3c1"/>
    <path d="M450 182 L456 156 L432 172 Z" fill="#ffb3c1"/>

    <!-- Eyes -->
    <ellipse cx="382" cy="216" rx="14" ry="17" fill="#ffffff"/>
    <ellipse cx="430" cy="216" rx="14" ry="17" fill="#ffffff"/>
    <ellipse cx="384" cy="218" rx="8" ry="13" fill="#2b2d42"/>
    <ellipse cx="432" cy="218" rx="8" ry="13" fill="#2b2d42"/>
    <circle cx="387" cy="212" r="3.5" fill="#ffffff"/>
    <circle cx="435" cy="212" r="3.5" fill="#ffffff"/>

    <!-- Nose + mouth -->
    <path d="M397 242 h16 l-8 9 z" fill="#e0577a"/>
    <path d="M405 251 q-12 14 -24 4 M405 251 q12 14 24 4" fill="none" stroke="#8a5a1b" stroke-width="4" stroke-linecap="round"/>
    <path d="M405 251 v10" stroke="#8a5a1b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g stroke="#8a5a1b" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M372 240 L330 232"/><path d="M372 250 L332 254"/>
      <path d="M438 240 L480 232"/><path d="M438 250 L478 254"/>
    </g>

    <!-- Cheeks -->
    <ellipse cx="364" cy="244" rx="12" ry="7" fill="#ff9fb0" opacity="0.75"/>
    <ellipse cx="446" cy="244" rx="12" ry="7" fill="#ff9fb0" opacity="0.75"/>
  </g>

  <!-- Floating little star buddy -->
  <g transform="translate(640 250) rotate(14)">
    <path d="M0 -26 L8 -8 L27 -8 L12 4 L18 23 L0 12 L-18 23 L-12 4 L-27 -8 L-8 -8 Z"
          fill="#ffe066" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-6" cy="0" r="3" fill="#8a5a1b"/>
    <circle cx="7" cy="0" r="3" fill="#8a5a1b"/>
    <path d="M-5 9 q6 6 12 0" fill="none" stroke="#8a5a1b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
