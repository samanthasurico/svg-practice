    <!-- Sunglasses -->
    <path d="M566 280 h44" stroke="#1f2430" stroke-width="5" stroke-linecap="round"/>
    <rect x="572" y="272" width="26" height="18" rx="8" fill="#1f2430"/>
    <rect x="600" y="272" width="26" height="18" rx="8" fill="#1f2430"/>
    <rect x="576" y="276" width="8" height="5" rx="2.5" fill="#5c7cfa" opacity="0.8"/>

    <!-- Helmet (backwards cap style) -->
    <path d="M542 284 Q548 240 586 240 Q620 244 622 276 L622 282 L544 282 Z" fill="#f4a261" stroke="#c96f2e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M544 280 q-18 2 -30 12 q14 4 30 -2" fill="#f4a261" stroke="#c96f2e" stroke-width="3" stroke-linejoin="round"/>

    <path d="M556 276 Q532 286 542 328 Q558 332 566 306 Q570 286 556 276 Z" fill="#3a220c" stroke="#241304" stroke-width="2"/>

    <path d="M486 390 Q505 388 516 374" fill="none" stroke="#5c3a17" stroke-width="17" stroke-linecap="round"/>
    <ellipse cx="519" cy="370" rx="9" ry="7" fill="#4a2c12" stroke="#3a220c" stroke-width="2"/>

    <path d="M342 388 Q354 430 368 454" fill="none" stroke="#5c3a17" stroke-width="19" stroke-linecap="round"/>
    <ellipse cx="372" cy="456" rx="14" ry="8" fill="#4a2c12" stroke="#3a220c" stroke-width="2"/>
    <ellipse cx="342" cy="380" rx="25" ry="21" fill="#6b4423" opacity="0.7"/>
