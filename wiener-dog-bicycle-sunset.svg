<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a67"/>
      <stop offset="55%" stop-color="#7f5f9e"/>
      <stop offset="100%" stop-color="#f2a65a"/>
    </linearGradient>
    <linearGradient id="fur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2b"/>
      <stop offset="100%" stop-color="#5c3a17"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#f5df9a"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dusk)"/>
  <circle cx="620" cy="110" r="40" fill="url(#moon)"/>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="70" r="2.5"/>
    <circle cx="200" cy="140" r="1.8"/>
    <circle cx="330" cy="60" r="2.2"/>
    <circle cx="450" cy="110" r="1.6"/>
    <circle cx="720" cy="60" r="2"/>
    <circle cx="540" cy="180" r="1.7"/>
    <circle cx="60" cy="200" r="1.9"/>
  </g>
  <path d="M0 480 Q180 430 380 472 T800 460 L800 600 L0 600 Z" fill="#4a5d3a"/>
  <rect x="0" y="530" width="800" height="70" fill="#3c4f30"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#2f3f26" stroke-width="3"/>
  <line x1="20" y1="568" x2="780" y2="568" stroke="#d9d3b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 28"/>

