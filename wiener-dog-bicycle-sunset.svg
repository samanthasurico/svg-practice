        <line x1="240" y1="420" x2="240" y2="520"/>
        <line x1="190" y1="470" x2="290" y2="470"/>
        <line x1="204" y1="434" x2="276" y2="506"/>
        <line x1="204" y1="506" x2="276" y2="434"/>
      </g>
      <circle cx="240" cy="470" r="9" fill="#c3ccd8" stroke="#1f2430" stroke-width="3"/>
    </g>
    <g>
      <circle cx="560" cy="470" r="58" fill="none" stroke="#1f2430" stroke-width="10"/>
      <g stroke="#9aa5b1" stroke-width="2.5">
        <line x1="560" y1="420" x2="560" y2="520"/>
        <line x1="510" y1="470" x2="610" y2="470"/>
        <line x1="524" y1="434" x2="596" y2="506"/>
        <line x1="524" y1="506" x2="596" y2="434"/>
      </g>
      <circle cx="560" cy="470" r="9" fill="#c3ccd8" stroke="#1f2430" stroke-width="3"/>
    </g>

    <g fill="none" stroke="#e63946" stroke-width="11" stroke-linecap="round">
      <line x1="240" y1="470" x2="395" y2="470"/>
      <line x1="240" y1="470" x2="338" y2="410"/>
      <line x1="395" y1="470" x2="338" y2="410"/>
      <line x1="338" y1="410" x2="522" y2="410"/>
      <line x1="395" y1="470" x2="522" y2="410"/>
    </g>
    <line x1="522" y1="410" x2="560" y2="470" stroke="#9aa5b1" stroke-width="7" stroke-linecap="round"/>
    <line x1="522" y1="410" x2="526" y2="372" stroke="#1f2430" stroke-width="8" stroke-linecap="round"/>
    <path d="M526 372 L500 370" stroke="#1f2430" stroke-width="9" stroke-linecap="round"/>
    <path d="M508 368 h-14" stroke="#ffd166" stroke-width="12" stroke-linecap="round"/>

    <path d="M195 440 Q240 396 285 440" fill="none" stroke="#e63946" stroke-width="6" stroke-linecap="round"/>
    <path d="M515 440 Q560 396 605 440" fill="none" stroke="#e63946" stroke-width="6" stroke-linecap="round"/>

    <path d="M240 480 Q315 496 395 482" fill="none" stroke="#5a5f78" stroke-width="4" stroke-dasharray="4 4"/>
    <line x1="369" y1="460" x2="421" y2="480" stroke="#1f2430" stroke-width="7" stroke-linecap="round"/>
    <circle cx="395" cy="470" r="14" fill="#9aa5b1" stroke="#1f2430" stroke-width="4"/>
    <rect x="353" y="455" width="32" height="9" rx="4" fill="#1f2430"/>

    <line x1="338" y1="410" x2="334" y2="400" stroke="#9aa5b1" stroke-width="7"/>
    <path d="M304 400 q30 -10 58 0 q-6 9 -28 9 q-24 0 -30 -9 z" fill="#1f2430"/>

