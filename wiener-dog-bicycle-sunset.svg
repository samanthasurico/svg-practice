    <path d="M186 420 h44 l-6 34 q-16 6 -32 0 z" fill="#b5834f" stroke="#8a5f33" stroke-width="3" stroke-linejoin="round"/>
    <path d="M192 432 h32 M190 442 h36" stroke="#8a5f33" stroke-width="2"/>
    <circle cx="200" cy="414" r="7" fill="#ff8fab"/>
    <circle cx="214" cy="408" r="7" fill="#ffd166"/>
    <circle cx="226" cy="414" r="7" fill="#c77dff"/>
  </g>

  <!-- Dog -->
  <g id="dog">
    <path d="M290 372 Q252 366 244 336" fill="none" stroke="#4a2c12" stroke-width="12" stroke-linecap="round"/>

    <ellipse cx="410" cy="372" rx="125" ry="34" fill="url(#fur2)" stroke="#3a220c" stroke-width="3"/>
    <ellipse cx="418" cy="390" rx="96" ry="12" fill="#a97c50" opacity="0.5"/>

    <path d="M505 340 Q600 330 640 310 Q600 352 512 356 Z" fill="#457b9d" stroke="#2f5a76" stroke-width="2"/>

    <path d="M508 364 Q545 340 566 306" fill="none" stroke="url(#fur2)" stroke-width="42" stroke-linecap="round"/>
    <path d="M518 332 Q538 346 558 326" fill="none" stroke="#457b9d" stroke-width="11" stroke-linecap="round"/>

    <ellipse cx="578" cy="292" rx="36" ry="30" fill="url(#fur2)" stroke="#3a220c" stroke-width="3"/>
    <path d="M596 282 Q644 280 662 296 Q664 312 642 316 Q608 320 592 310 Z" fill="#8a5a2b" stroke="#3a220c" stroke-width="3" stroke-linejoin="round"/>
